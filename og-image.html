<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OG Image</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .og {
    width: 1200px; height: 630px;
    background:
      radial-gradient(ellipse 800px 500px at 20% 15%, rgba(0,230,118,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 700px 500px at 85% 90%, rgba(68,138,255,0.14) 0%, transparent 50%),
      radial-gradient(ellipse 400px 300px at 90% 10%, rgba(255,214,0,0.10) 0%, transparent 60%),
      linear-gradient(135deg, #040810 0%, #0E1A2E 60%, #0B1726 100%);
    color: #F0F2F5;
    padding: 64px 80px;
    box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  /* Pelouse subtile en bas */
  .pitch {
    position: absolute; left: 0; right: 0; bottom: 0; height: 180px;
    background: linear-gradient(180deg, transparent, rgba(0,230,118,0.05) 60%);
    pointer-events: none;
  }
  /* Cercles decoratifs en background */
  .deco { position: absolute; border-radius: 50%; pointer-events: none; }
  .deco-1 { width: 380px; height: 380px; right: -120px; top: -120px;
            border: 1px solid rgba(0,230,118,0.10); }
  .deco-2 { width: 240px; height: 240px; right: -60px; top: -60px;
            border: 1px solid rgba(0,230,118,0.18); }

  .badge {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(0,230,118,0.12);
    border: 1px solid rgba(0,230,118,0.45);
    color: #00E676;
    font-size: 16px; font-weight: 800; letter-spacing: 3px;
  }
  .logo {
    font-size: 124px; font-weight: 900;
    background: linear-gradient(135deg, #00E676 0%, #FFFFFF 65%, #00E676 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 22px 0 6px;
    letter-spacing: -5px; line-height: 1;
  }
  .logo-sub {
    font-size: 22px; color: #4A5568;
    letter-spacing: 5px; text-transform: uppercase; font-weight: 700;
  }
  .tagline {
    font-size: 44px; font-weight: 800;
    line-height: 1.15; max-width: 880px; margin-top: 32px;
  }
  .green  { color: #00E676; }
  .yellow { color: #FFD600; }
  .features {
    display: flex; gap: 16px; margin-top: 32px;
    align-items: center;
  }
  .feat {
    padding: 14px 22px; border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 22px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .url {
    position: absolute; bottom: 56px; right: 80px;
    font-size: 26px; color: #8E99A4; font-weight: 700;
    z-index: 2;
  }
  .url strong { color: #00E676; }
  .corner {
    position: absolute; top: 64px; right: 80px;
    display: flex; gap: 10px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .d1 { background: #00E676; box-shadow: 0 0 16px rgba(0,230,118,0.6); }
  .d2 { background: #FFD600; box-shadow: 0 0 16px rgba(255,214,0,0.5); }
  .d3 { background: #FF1744; box-shadow: 0 0 16px rgba(255,23,68,0.5); }
</style>
</head>
<body>
  <div class="og">
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="pitch"></div>
    <div class="corner">
      <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
    </div>
    <div>
      <span class="badge">CHAT &amp; BET</span>
      <div class="logo">Plugbet</div>
      <div class="logo-sub">FCFA &nbsp;·&nbsp; CAMEROUN</div>
      <div class="tagline">
        Scores foot en direct,<br>
        <span class="green">Fantasy League</span> et<br>
        <span class="yellow">8 jeux multijoueurs</span>
      </div>
      <div class="features">
        <span class="feat">&#x26BD; Live</span>
        <span class="feat">&#x1F3C6; FPL</span>
        <span class="feat">&#x1F3B2; Ludo</span>
        <span class="feat">&#x1F4B8; Mobile Money</span>
      </div>
    </div>
    <div class="url"><strong>plugbetx</strong>.com</div>
  </div>
</body>
</html>
