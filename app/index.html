<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plugbet - Chat & Bet, scores en direct et jeux.">
  <!-- Color theme pour la barre URL Chrome Android -->
  <meta name="theme-color" content="#040810">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plugbet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- ════════════════════════════════════════════════════════
       PERF — Preconnect aux origins critiques (DNS + TLS warm-up)
       Gain typique : -100..-300ms sur les 1er appels API.
       ═══════════════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://dqzrociaaztlezwlgzwh.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://dqzrociaaztlezwlgzwh.supabase.co">
  <!-- StatPal direct (via Edge Function proxy, donc meme origin Supabase) -->
  <!-- Logos equipes (team_logo_proxy edge function) -->
  <link rel="preconnect" href="https://dqzrociaaztlezwlgzwh.functions.supabase.co" crossorigin>

  <!-- PERF — Preload des bundles Flutter (priorite haute, parallele au HTML) -->
  <link rel="modulepreload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="manifest.json" as="fetch" crossorigin>
  <link rel="preload" href="favicon.png" as="image">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plugbet</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #040810; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #loading-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, #0E1A2E 0%, #040810 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    #loading-overlay.done { opacity: 0; pointer-events: none; }
    .logo-text {
      font-size: 42px; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, #00E676, #F0F2F5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .logo-sub {
      font-size: 12px; color: #4A5568; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 48px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(0, 230, 118, 0.15);
      border-top-color: #00E676; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #8E99A4; font-size: 13px; margin-top: 24px; font-weight: 500; }
    .progress-bar {
      margin-top: 20px; width: 200px; height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00E676, #FFD600);
      width: 30%; animation: progress 2s ease-in-out infinite;
    }
    @keyframes progress {
      0%   { margin-left: -30%; }
      100% { margin-left: 100%; }
    }
  </style>
</head>
<body>
  <!-- Ecran de chargement affiche tant que Flutter n'a pas demarre -->
  <div id="loading-overlay">
    <div class="logo-text">Plugbet</div>
    <div class="logo-sub">Chat &amp; Bet</div>
    <div class="spinner"></div>
    <div class="loading-text">Chargement de l'application...</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>

  <script>
    // ════════════════════════════════════════════════════════════
    // PERF METRICS — Mesure tous les paliers de chargement
    // ════════════════════════════════════════════════════════════
    // Marks accessibles dans DevTools Performance + console + Sentry web.
    // Permet d'identifier OU on perd le plus de temps : DNS, JS bundle,
    // Flutter init, hydratation IndexedDB, premier paint.
    window.__PLUGBET_PERF__ = { t0: performance.now() };
    try { performance.mark('pb_html_parsed'); } catch (e) {}

    function pbMark(name) {
      try {
        performance.mark('pb_' + name);
        var t = Math.round(performance.now() - window.__PLUGBET_PERF__.t0);
        console.log('[Plugbet PERF]', name, t + 'ms');
        window.__PLUGBET_PERF__[name] = t;
      } catch (e) {}
    }
    window.pbMark = pbMark;

    // Reporting global sur 'load' (toutes ressources telechargees)
    window.addEventListener('load', function () {
      pbMark('window_load');
      // Web Vitals approchant : LCP, FCP via PerformanceObserver
      try {
        if ('PerformanceObserver' in window) {
          new PerformanceObserver(function (list) {
            list.getEntries().forEach(function (e) {
              if (e.name === 'first-contentful-paint') {
                console.log('[Plugbet PERF] FCP', Math.round(e.startTime) + 'ms');
                window.__PLUGBET_PERF__.fcp = Math.round(e.startTime);
              }
            });
          }).observe({ type: 'paint', buffered: true });
          new PerformanceObserver(function (list) {
            var entries = list.getEntries();
            var lcp = entries[entries.length - 1];
            if (lcp) {
              console.log('[Plugbet PERF] LCP', Math.round(lcp.startTime) + 'ms');
              window.__PLUGBET_PERF__.lcp = Math.round(lcp.startTime);
            }
          }).observe({ type: 'largest-contentful-paint', buffered: true });
        }
      } catch (e) {}
    });
  </script>

  <script>
    // ============================================================
    // KILL-SWITCH SERVICE WORKER — PERMANENT, SANS DEADLINE
    // ============================================================
    // D'anciennes versions ont deploye un vrai flutter_service_worker.js
    // (PWA cache-first). Ces SW restent installes chez les visiteurs
    // recurrents et continuent de servir l'app en cache, court-circuitant
    // le Cache-Control: no-store cote serveur. Ce build n'a PLUS de SW
    // (--pwa-strategy=none) : il faut donc EVINCER activement tout SW
    // residuel, sinon ces clients sont figes a vie sur l'ancienne version.
    //
    // Anti-boucle (le bug de la version precedente venait d'une DEADLINE
    // codee qui desactivait l'echappatoire le 2026-05-21) :
    //   - Si la page est CONTROLEE par un SW et pas deja nettoyee dans
    //     cette session : unregister tous les SW + purge CacheStorage,
    //     puis UN seul reload (garde sessionStorage).
    //   - Sinon : purge en arriere-plan sans reload. Une fois les clients
    //     evinces, plus aucun SW n'est installe (build sans SW) -> ce
    //     bloc devient un no-op invisible et permanent. Aucune date limite.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      try {
        var hadController = !!navigator.serviceWorker.controller;
        var alreadyCleared = sessionStorage.getItem('pb_sw_killed') === '1';

        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister().catch(function () {}); });
        }).catch(function () {});
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
          }).catch(function () {});
        }

        if (hadController && !alreadyCleared) {
          sessionStorage.setItem('pb_sw_killed', '1');
          setTimeout(function () { window.location.reload(); }, 300);
        }
      } catch (e) {
        console.warn('[Plugbet] SW kill-switch:', e);
      }
    })();
  </script>

  <!-- Build --pwa-strategy=none : aucun SW genere. Fraicheur assuree par
       Cache-Control: no-store (nginx) + kill-switch ci-dessus pour evincer
       les SW historiques. -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Marker JS bundle telecharge + parse
    window.pbMark && pbMark('bootstrap_loaded');

    // Supprime l'overlay une fois que Flutter a dessine sa premiere frame.
    // ATTENTION : on garde l'overlay encore 100ms apres flutter-first-frame
    // pour eviter le flash si le splash Flutter n'est pas encore monte.
    // Sinon : overlay disparait -> ecran noir 1 frame -> splash Flutter
    // apparait (pas terrible).
    window.addEventListener('flutter-first-frame', () => {
      window.pbMark && pbMark('flutter_first_frame');
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        // Petit delai pour laisser Flutter prendre le relai visuellement
        setTimeout(() => {
          overlay.classList.add('done');
          setTimeout(() => overlay.remove(), 500);
          window.pbMark && pbMark('overlay_removed');
        }, 80);
      }
    });

    // [Audit A4] Bloc service-worker retiré : plus de SW (build
    // --pwa-strategy=none) -> plus de controllerchange->reload en
    // pleine partie Ludo, plus de gel post-deadline. Fraîcheur =
    // Cache-Control: no-store (vercel.json).
  </script>
</body>
</html>
